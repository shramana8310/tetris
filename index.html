<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport"/>
  <meta content="#0b0d14" name="theme-color"/>
  <title>
   Tetris
  </title>
  <style>
   :root {
      color-scheme: dark;
      --bg: #0b0d14;
      --panel: #121622;
      --border: #252b3b;
      --text: #f0f2fa;
      --muted: #8c95ab;
      --accent: #9d7bff;
      --accent-hover: #b09aff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      touch-action: pan-x pan-y;
      overscroll-behavior: none;
    }

    canvas.emscripten,
    #touch-controls {
      touch-action: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 36px 20px;
      background:
        radial-gradient(ellipse at 50% 0%, #20203e 0%, transparent 48%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
    }

    .page {
      width: min(100%, 1000px);
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 26px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .mark {
      display: grid;
      grid-template-columns: repeat(2, 11px);
      grid-template-rows: repeat(2, 11px);
      gap: 3px;
      transform: rotate(-8deg);
    }

    .mark span {
      border-radius: 3px;
      background: var(--accent);
    }

    .mark span:nth-child(2) {
      background: #51d8f2;
    }

    .mark span:nth-child(3) {
      background: #ffcf5a;
    }

    .mark span:nth-child(4) {
      background: #ff6f9f;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 850;
      letter-spacing: 0.16em;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .tag {
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.1em;
    }

    .game-panel {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgb(18 22 34 / 90%);
      box-shadow:
        0 24px 80px rgb(0 0 0 / 30%),
        0 0 45px rgb(157 123 255 / 6%);
    }

    .game-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }

    .game-label {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #51dfa0;
      box-shadow: 0 0 10px rgb(81 223 160 / 50%);
    }

    #status {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .stage {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 300px;
      padding: 28px 16px;
      background:
        radial-gradient(ellipse at center, #171b2b 0%, #10131d 72%);
    }

    .emscripten_border {
      overflow: hidden;
      max-width: 100%;
      border: 1px solid #30364a;
      border-radius: 6px;
      background: #05070c;
      box-shadow: 0 0 30px rgb(0 0 0 / 40%);
    }

    canvas.emscripten {
      display: block;
      max-width: 100%;
      border: 0;
      padding: 0;
      background: #05070c;
    }

    .loading {
      padding: 12px 18px;
      border-top: 1px solid var(--border);
    }

    #progress {
      display: block;
      width: 100%;
      height: 4px;
      margin: 0;
      overflow: hidden;
      border: 0;
      border-radius: 99px;
      appearance: none;
      background: #282d40;
    }

    #progress::-webkit-progress-bar {
      background: #282d40;
    }

    #progress::-webkit-progress-value {
      background: var(--accent);
    }

    #progress::-moz-progress-bar {
      background: var(--accent);
    }

    #progress[hidden] {
      display: none;
    }

    button {
      padding: 9px 15px;
      border: 1px solid #6550ad;
      border-radius: 8px;
      background: #7556d9;
      color: white;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    button:hover {
      background: var(--accent-hover);
      color: #11101a;
    }

    button:active {
      transform: scale(0.97);
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    details {
      margin-top: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
    }

    summary {
      padding: 14px 16px;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }

    #output {
      display: block;
      width: 100%;
      height: 160px;
      margin: 0;
      padding: 14px 16px;
      resize: vertical;
      border: 0;
      border-top: 1px solid var(--border);
      border-radius: 0 0 12px 12px;
      outline: none;
      background: #090b11;
      color: #b6c4dc;
      font: 12px/1.6 "SFMono-Regular", Consolas, monospace;
    }

    footer {
      margin-top: 22px;
      color: #646d82;
      font-size: 11px;
      text-align: center;
      letter-spacing: 0.04em;
    }

    @media (max-width: 600px) {
      body {
        padding: 22px 12px;
      }

      h1 {
        font-size: 22px;
      }

      .subtitle {
        font-size: 10px;
      }

      .tag {
        font-size: 9px;
      }

      .game-toolbar {
        padding: 12px;
      }

      .stage {
        padding: 16px 8px;
      }
    }

    #touch-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 16px;
      width: 100%;
      max-width: 480px;
      margin: 16px auto 0;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .control-group {
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    .movement-controls {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-content: start;
    }

    .movement-controls button[data-action="left"] {
      grid-column: 1;
      grid-row: 1;
    }

    .movement-controls button[data-action="right"] {
      grid-column: 2;
      grid-row: 1;
    }

    .movement-controls button[data-action="down"] {
      grid-column: 1 / 3;
      grid-row: 2;
      justify-self: center;
      width: 48%;
    }

    .action-controls {
      grid-template-columns: 1fr;
      align-content: start;
    }

    .system-controls {
      grid-column: 1 / -1;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 4px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    #touch-controls button {
      min-width: 0;
      min-height: 52px;
      padding: 8px 6px;
      border: 1px solid #505766;
      border-radius: 12px;
      background: #292f3b;
      color: white;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #touch-controls button:active {
      background: #475569;
      transform: scale(0.96);
    }

    @media (max-width: 360px) {
      #touch-controls {
        gap: 16px 8px;
      }

      #touch-controls button {
        font-size: 11px;
        min-height: 48px;
      }

      .system-controls {
        gap: 12px;
      }
    }
  </style>
 </head>
 <body>
  <main class="page">
   <header>
    <div class="brand">
     <div aria-hidden="true" class="mark">
      <span>
      </span>
      <span>
      </span>
      <span>
      </span>
      <span>
      </span>
     </div>
     <div>
      <h1>
       TETRIS
      </h1>
      <p class="subtitle">
       A LITTLE BLOCK-BUILDING GAME
      </p>
     </div>
    </div>
    <span class="tag">
     WEB EDITION
    </span>
   </header>
   <section aria-label="Game" class="game-panel">
    <div class="game-toolbar">
     <div class="game-label">
      <span class="dot" id="status-dot">
      </span>
      GAME
     </div>
     <div aria-live="polite" id="status" role="status">
      Downloading...
     </div>
    </div>
    <div class="stage">
     <div class="emscripten_border">
      <canvas aria-label="Tetris game canvas" class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1">
      </canvas>
     </div>
    </div>
    <div id="touch-controls">
     <div class="control-group movement-controls">
      <button aria-label="Move left" data-action="left" type="button">
       ◀ LEFT
      </button>
      <button aria-label="Move right" data-action="right" type="button">
       RIGHT ▶
      </button>
      <button aria-label="Move down" data-action="down" type="button">
       ▼ DOWN
      </button>
     </div>
     <div class="control-group action-controls">
      <button data-action="rotate" type="button">
       ↻ ROTATE
      </button>
      <button data-action="hard-drop" type="button">
       ⇊ DROP
      </button>
     </div>
     <div class="control-group system-controls">
      <button data-action="restart" type="button">
       ↻ RESTART
      </button>
      <button data-action="pause" type="button">
       Ⅱ PAUSE
      </button>
     </div>
    </div>
    <div class="loading">
     <progress hidden="" id="progress" max="100" value="0">
     </progress>
    </div>
   </section>
   <details>
    <summary>
     Developer console
    </summary>
    <textarea aria-label="Game console output" id="output" readonly="" rows="8"></textarea>
   </details>
   <footer>
    BUILT WITH C · SDL3 · EMSCRIPTEN
   </footer>
  </main>
  <script>
   var statusElement = document.getElementById('status');
    var progressElement = document.getElementById('progress');
    var canvasElement = document.getElementById('canvas');
    var outputElement = document.getElementById('output');

    if (outputElement) outputElement.value = '';

    canvasElement.addEventListener('webglcontextlost', (e) => {
      alert('Graphics context lost. Please reload the page.');
      e.preventDefault();
    }, false);

    var setStatus = (text) => {
      if (!setStatus.last) {
        setStatus.last = { time: Date.now(), text: '' };
      }

      if (text === setStatus.last.text) return;

      var match = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      var now = Date.now();

      if (match && now - setStatus.last.time < 30) return;

      setStatus.last.time = now;
      setStatus.last.text = text;

      if (match) {
        text = match[1];
        progressElement.value = parseFloat(match[2]) * 100;
        progressElement.max = parseFloat(match[4]) * 100;
        progressElement.hidden = false;
      } else {
        progressElement.value = 0;
        progressElement.max = 100;
        progressElement.hidden = true;
      }

      statusElement.textContent = text;

      var dot = document.getElementById('status-dot');
      dot.style.background =
        text === 'All downloads complete.' ? '#51dfa0' : '#ffcf5a';
    };

    var Module = {
      print(...args) {
        console.log(...args);

        if (outputElement) {
          outputElement.value += args.join(' ') + '\n';
          outputElement.scrollTop = outputElement.scrollHeight;
        }
      },

      canvas: canvasElement,
      setStatus: setStatus,
      totalDependencies: 0,

      monitorRunDependencies(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        setStatus(
          left
            ? 'Preparing... (' +
              (this.totalDependencies - left) + '/' +
              this.totalDependencies + ')'
            : 'All downloads complete.'
        );
      }
    };

    const touchActionIds = {
      left: 0,
      down: 1,
      right: 2,
      rotate: 3,
      "hard-drop": 4,
      pause: 5,
      restart: 6
    };

    const repeatableActions = new Set(["left", "down", "right"]);

    function sendTouchKey(action, pressed) {
      if (typeof Module._PushTouchKey !== "function") {
        console.warn("Touch input bridge is not available yet.");
        return;
      }

      Module._PushTouchKey(touchActionIds[action], pressed ? 1 : 0);
    }

    document.querySelectorAll("#touch-controls button").forEach(button => {
      const action = button.dataset.action;
      let repeatDelay = null;
      let repeatInterval = null;
      let pressed = false;

      function stopPress() {
        if (!pressed) return;

        pressed = false;
        clearTimeout(repeatDelay);
        clearInterval(repeatInterval);

        repeatDelay = null;
        repeatInterval = null;

        button.classList.remove("is-pressed");
        sendTouchKey(action, false);
      }

      button.addEventListener("pointerdown", event => {
        event.preventDefault();

        if (pressed) return;

        pressed = true;
        button.classList.add("is-pressed");
        button.setPointerCapture(event.pointerId);

        sendTouchKey(action, true);

        if (repeatableActions.has(action)) {
          repeatDelay = setTimeout(() => {
            if (!pressed) return;

            repeatInterval = setInterval(() => {
              if (pressed) sendTouchKey(action, true);
            }, 80);
          }, 180);
        }
      });

      button.addEventListener("pointerup", stopPress);
      button.addEventListener("pointercancel", stopPress);
      button.addEventListener("lostpointercapture", stopPress);
    });

    setStatus('Downloading...');

    window.onerror = window.onunhandledrejection = () => {
      setStatus('Error occurred. Check the developer console.');
      document.getElementById('status-dot').style.background = '#ff6b7a';
    };
  </script>
  <script async="" src="tetris.js">
  </script>
 </body>
</html>
